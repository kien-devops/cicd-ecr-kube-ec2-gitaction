---
- name: Prepare Kubernetes worker and join cluster
  hosts: web
  gather_facts: false
  become: true

  pre_tasks:
    - name: Wait for SSH to become available
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Gather facts
      setup:

    - name: Load kubeadm join command from env file
      set_fact:
        kubeadm_join_command: "{{ lookup('file', playbook_dir + '/.env') | regex_search('(?m)^KUBEADM_JOIN_COMMAND=(.*)$', '\\1') | first }}"

    - name: Validate kubeadm join command
      assert:
        that:
          - kubeadm_join_command is defined
          - kubeadm_join_command | length > 0
        fail_msg: "Missing KUBEADM_JOIN_COMMAND in {{ playbook_dir }}/.env"

  tasks:
    - name: Check whether node already joined the cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Copy Kubernetes common setup script
      copy:
        src: "{{ playbook_dir }}/common.sh"
        dest: /tmp/k8s-common.sh
        mode: "0755"
      when: not kubelet_conf.stat.exists

    - name: Normalize common setup script line endings
      replace:
        path: /tmp/k8s-common.sh
        regexp: "\r"
        replace: ""
      when: not kubelet_conf.stat.exists

    - name: Run Kubernetes common setup script with bash
      command: bash /tmp/k8s-common.sh
      when: not kubelet_conf.stat.exists

    - name: Join Kubernetes cluster
      command: "{{ kubeadm_join_command }}"
      when: not kubelet_conf.stat.exists
