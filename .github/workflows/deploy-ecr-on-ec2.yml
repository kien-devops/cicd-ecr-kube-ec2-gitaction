name: Build and Push on EC2

on:
  push:
    branches:
      - master

env:
  REPO_DIR: /home/ubuntu/cicd-ecr-kube-ec2-gitaction
  REPO_URL: https://github.com/kien-devops/cicd-ecr-kube-ec2-gitaction.git
  REGISTRY: ${{ secrets.ECR_REGISTRY }}
  AWS_REGION: ap-southeast-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/ec2_key
          printf '%s' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key

      - name: Build and push images on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
        run: |
          set -euo pipefail

          GIT_AUTH=$(printf '%s' "${GIT_USERNAME}:${GIT_PASSWORD}" | base64 | tr -d '\n')

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            "ubuntu@${EC2_HOST}" \
            "GIT_AUTH='${GIT_AUTH}' REPO_DIR='${REPO_DIR}' REPO_URL='${REPO_URL}' REGISTRY='${REGISTRY}' AWS_REGION='${AWS_REGION}' /bin/bash -s" <<'EOF'
          set -euo pipefail

          command -v aws >/dev/null 2>&1 || { echo "aws CLI is not installed on EC2"; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "docker is not installed on EC2"; exit 1; }

          if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              git -c http.extraHeader="Authorization: Basic $GIT_AUTH" clone -b main "$REPO_URL" "$REPO_DIR"
          else
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL"
              git -c http.extraHeader="Authorization: Basic $GIT_AUTH" fetch origin main
              git reset --hard origin/main
          fi

          cd "$REPO_DIR"
          aws ecr get-login-password --region "$AWS_REGION" | sudo docker login --username AWS --password-stdin "$REGISTRY"
          sudo docker build -t ecr-fe -f hospital_FE/Dockerfile hospital_FE
          sudo docker build -t ecr-be -f hopital_BE/Hospital_API/Dockerfile hopital_BE/Hospital_API
          sudo docker tag ecr-fe:latest "$REGISTRY/ecr-fe:latest"
          sudo docker tag ecr-be:latest "$REGISTRY/ecr-be:latest"
          sudo docker push "$REGISTRY/ecr-fe:latest"
          sudo docker push "$REGISTRY/ecr-be:latest"
          EOF
