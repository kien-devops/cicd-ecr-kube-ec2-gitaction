global
    log stdout format raw local0
    maxconn 4096
    master-worker

defaults
    log global
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_front
    # Public DNS should point to the HAProxy VPS public IP.
    bind *:80
    mode http
    option httplog
    option forwardfor
    default_backend traefik_nodes_http

frontend https_front
    bind *:443
    mode tcp
    option tcplog
    default_backend traefik_nodes_https

backend traefik_nodes_http
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host benhvien.teamdevops.shop
    # Run ./discover-traefik-nodes.sh to replace this fallback with live
    # Kubernetes worker IPs that are running Traefik pods.
    server no_nodes 127.0.0.1:9 disabled

backend traefik_nodes_https
    mode tcp
    balance roundrobin
    option tcp-check
    # Run ./discover-traefik-nodes.sh to replace this fallback with live
    # Kubernetes worker IPs that are running Traefik pods.
    server no_nodes 127.0.0.1:9 disabled
