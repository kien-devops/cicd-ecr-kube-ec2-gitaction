apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-registry-secret-refresh
  namespace: hospital
spec:
  schedule: "0 */10 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: OnFailure
          containers:
            - name: ecr-secret-refresher
              image: alpine/k8s:1.30.0
              imagePullPolicy: IfNotPresent
              env:
                - name: AWS_REGION
                  value: "us-east-1"
                - name: ECR_REGISTRY
                  value: "606030503959.dkr.ecr.us-east-1.amazonaws.com"
                - name: SECRET_NAME
                  value: "ecr-registry-secret"
                - name: NAMESPACE
                  value: "hospital"
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  echo "Getting ECR login token..."

                  TOKEN="$(aws ecr get-login-password --region "$AWS_REGION")"

                  echo "Creating/updating Kubernetes image pull secret..."

                  kubectl create secret docker-registry "$SECRET_NAME" \
                    --namespace="$NAMESPACE" \
                    --docker-server="$ECR_REGISTRY" \
                    --docker-username=AWS \
                    --docker-password="$TOKEN" \
                    --dry-run=client -o yaml | kubectl apply -f -

                  echo "ECR secret refreshed successfully."

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  namespace: hospital

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
  namespace: hospital
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs:
      - get
      - create
      - patch
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
  namespace: hospital
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: hospital
roleRef:
  kind: Role
  name: ecr-secret-refresher
  apiGroup: rbac.authorization.k8s.io