# Create the HTTP Gateway entrypoint on port 8000.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway-v1
  namespace: hospital
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same

---
# Limit API requests to reduce abuse.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-rate-limit-v1
  namespace: hospital
spec:
  rateLimit:
    average: 10
    burst: 20

---
# Optional middleware to strip /api when the backend does not serve that prefix.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-strip-prefix-v1
  namespace: hospital
spec:
  stripPrefix:
    prefixes:
      - /api

---
# Add baseline security headers to responses.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers-v1
  namespace: hospital
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true

---
# Group API middleware in a reusable chain.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-chain-v1
  namespace: hospital
spec:
  chain:
    middlewares:
      - name: api-rate-limit-v1
      - name: security-headers-v1

---
# Route /api to the backend before falling back to the frontend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route-v1
  namespace: hospital
spec:
  parentRefs:
    - name: web-gateway-v1
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: be-service-v1
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fe-service-v1
          port: 80
