# Run the hospital frontend from the ECR image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-deployment-v1
  namespace: hospital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fe-v1
  template:
    metadata:
      labels:
        app: fe-v1
    spec:
      securityContext:
        runAsNonRoot: true
        # Must match the UID of USER nginx inside the FE Dockerfile (nginx:alpine image)
        runAsUser: 101
        fsGroup: 2000
      containers:
        - name: fe-v1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: 606030503959.dkr.ecr.us-east-1.amazonaws.com/ecr-fe:5fc32b772034ee9f72e88ce012681083508953c7
          imagePullPolicy: Always
          ports:
            # nginx runs on 8000 (non-root users cannot bind ports < 1024)
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              # nginx is running on 8000 now
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              # nginx is running on 8000 now
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
