# Run the hospital frontend from the ECR image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-deployment-v1
  namespace: hospital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fe-v1
  template:
    metadata:
      labels:
        app: fe-v1
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: fe-v1
          image: ${ECR_REGISTRY}/ecr-fe:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
