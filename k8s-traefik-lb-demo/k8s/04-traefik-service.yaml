# Mo Traefik ra NodePort de HAProxy/ALB co the forward traffic vao cluster.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: traefik
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
    - name: websecure
      protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30443
