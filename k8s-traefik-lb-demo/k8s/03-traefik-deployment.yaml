# Run Traefik on every node with Kubernetes Gateway API and Traefik CRD providers enabled.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
spec:
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.1
          imagePullPolicy: IfNotPresent
          args:
            - --log.level=INFO
            # Disable dashboard in production or restrict to internal entrypoint only
            - --api.dashboard=false
            - --ping=true
            - --providers.kubernetesgateway=true
            - --providers.kubernetescrd=true
            # HTTP entrypoint: redirect all traffic to HTTPS
            - --entrypoints.web.address=:8000
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.web.http.redirections.entrypoint.permanent=true
            # HTTPS entrypoint with TLS enabled
            - --entrypoints.websecure.address=:443
            - --entrypoints.websecure.http.tls=true
            # Let's Encrypt ACME TLS certificate resolver
            - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
            - --certificatesresolvers.letsencrypt.acme.email=<ACME_EMAIL>
            - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
          volumeMounts:
            - name: acme-storage
              mountPath: /data
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 443
            - name: traefik
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: acme-storage
          emptyDir: {}
