apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Auth omitted, defaults to the EC2 instance role (metadata provider)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: be-db-secret
  namespace: hospital
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: be-db-secret
    creationPolicy: Owner
  data:
    - secretKey: default-connection
      remoteRef:
        key: hospital-db-connection
        property: default-connection
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-token-gen
  namespace: hospital
spec:
  region: us-east-1
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ecr-registry-secret
  namespace: hospital
spec:
  refreshInterval: 1h
  target:
    name: ecr-registry-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths": {"606030503959.dkr.ecr.us-east-1.amazonaws.com": {"username": "{{ .username }}", "password": "{{ .password }}", "auth": "{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ECRAuthorizationToken
        name: ecr-token-gen
